name: Deploy Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:

concurrency:
  group: deploy-web-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  deploy:
    name: Deploy Web
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || vars.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.EXPO_PUBLIC_GEMINI_API_KEY || vars.EXPO_PUBLIC_GEMINI_API_KEY }}
      EXPO_PUBLIC_ENABLE_GEMINI_DIAGNOSTICS: ${{ secrets.EXPO_PUBLIC_ENABLE_GEMINI_DIAGNOSTICS || vars.EXPO_PUBLIC_ENABLE_GEMINI_DIAGNOSTICS }}
      EXPO_PUBLIC_DEV_OTP: ${{ secrets.EXPO_PUBLIC_DEV_OTP || vars.EXPO_PUBLIC_DEV_OTP }}
    steps:
      - name: Check required environment
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "You must add an EXPO_TOKEN repository secret before this workflow can deploy."
            echo "Create one at https://expo.dev/settings/access-tokens, then add it in GitHub Actions secrets."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_URL" ]; then
            echo "You must add EXPO_PUBLIC_SUPABASE_URL as a repository secret or variable before deploying."
            exit 1
          fi
          if [ -z "$EXPO_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "You must add EXPO_PUBLIC_SUPABASE_ANON_KEY as a repository secret or variable before deploying."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.2

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export website
        run: pnpm exec expo export --platform web

      - name: Deploy production
        if: github.event_name != 'pull_request'
        run: pnpm exec eas deploy --prod --non-interactive

      - name: Deploy preview
        if: github.event_name == 'pull_request'
        id: deploy-preview
        run: |
          deploy_json="$(pnpm exec eas deploy --alias pr-${{ github.event.pull_request.number }} --non-interactive --json)"
          echo "$deploy_json"
          deploy_url="$(echo "$deploy_json" | jq -r '.alias.url // .url // .production.url')"
          echo "url=$deploy_url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const url = '${{ steps.deploy-preview.outputs.url }}';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `Web preview: ${url}`,
            });
